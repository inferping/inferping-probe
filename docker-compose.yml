services:
  inferping-probe:
    build: .
    image: ghcr.io/inferping/inferping-probe:latest
    container_name: inferping-probe
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      INFERPING_ENDPOINT: "https://app.inferping.eu"
      INFERPING_API_KEY: "${INFERPING_API_KEY}"
      INFERPING_REGION: "vpc-gpu-eu"
      LLM_API_KEY: "${LLM_API_KEY}"
      MCP_BEARER_TOKEN: "${MCP_BEARER_TOKEN}"
    volumes:
      - ./inferping.yaml:/etc/inferping/inferping.yaml:ro
    command: ["--config", "/etc/inferping/inferping.yaml"]
